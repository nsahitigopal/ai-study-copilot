name: AI Study Copilot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Python Installation
        run: |
          python --version
          pip --version

      - name: Verify Installed Packages
        run: |
          python -c "import streamlit"
          python -c "import faiss"
          python -c "import openai"

      - name: Verify Project Imports
        run: |
          python -c "from utils.chunking import *"
          python -c "from utils.embeddings import *"
          python -c "from utils.vector_store import *"
          python -c "from utils.retrieval import *"

      - name: Run Tests
        run: pytest